# Extra checks that run only on the release-please PR.
#
# Lint, tsc and tests already run on every PR to main via node.yml; this adds
# the release-specific invariants (version consistency, tag not reused,
# expo-doctor) so they are enforced before the tag exists rather than after.

name: Release Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    name: Verify release readiness
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release preflight
        run: scripts/release-preflight.sh pr
