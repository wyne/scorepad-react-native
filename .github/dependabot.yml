# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Expo pins the versions of react-native and its native modules that a
      # given SDK is tested against. Bumping them independently produces a
      # binary that builds fine and fails at runtime -- react-native-pager-view
      # was carried a full major version past SDK 57 this way.
      #
      # These are upgraded together by `npx expo install --fix` as part of an
      # SDK upgrade, never one at a time. Everything else is still fair game.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-pager-view"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-view-shot"
      - dependency-name: "react-native-webview"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-picker/picker"
      - dependency-name: "react"
      - dependency-name: "react-dom"
